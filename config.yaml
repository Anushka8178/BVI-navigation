# BVI navigation - every tunable number lives here.
# Loaded once by navigation/config.py and passed to the constructors.
# Override any value from the command line, e.g.
#   --set planner.safety_margin_m=0.30 --set network.phone_ip=192.168.43.1

# ------------------------------------------------------------------
# Input
# ------------------------------------------------------------------
camera:
  # Default --source: IP Webcam app on the chest-mounted phone (MJPEG).
  # Pass --source videos\street6.mp4 to run on a recorded video instead.
  source: http://10.47.242.217:8080/video
  # URL streams only: give up if no new frame arrives for this long.
  read_timeout_s: 5.0
  # URL streams only: wait between reconnect attempts after a dropout.
  reconnect_delay_s: 1.0
  # URL streams only: frame rate written into the annotated output video.
  live_output_fps: 15.0
  # Print processing FPS this often.
  fps_report_interval_s: 5.0

# ------------------------------------------------------------------
# Network (Android rig: laptop on the phone's hotspot)
# ------------------------------------------------------------------
network:
  phone_ip: 10.47.242.217
  sensor_port: 8081          # SensorServer WebSocket port

# ------------------------------------------------------------------
# ESP32 + HC-SR04 range sensor over USB serial (navigation/range_sensor.py,
# firmware/esp32_range/esp32_range.ino). Lines: "D,<cm>,<millis>", -1 = no echo.
# Find the port with scripts/manual/check_esp32.py; override with --esp32-port.
# ------------------------------------------------------------------
esp32:
  serial_port: COM5
  baud: 115200
  stale_after_s: 0.3         # older reading -> latest_m() returns None
  read_timeout_s: 0.2        # serial readline timeout
  reconnect_delay_s: 1.0     # wait between attempts to open the port

# ------------------------------------------------------------------
# Ultrasonic + camera fusion (navigation/range_fusion.py), used when the
# ESP32 range sensor is running (not with --no-esp32). The nearest
# detection within +-cone_deg of straight ahead takes the measured
# distance if the reading is min_m..max_m and agrees with the camera's
# estimate within a factor agree_ratio. An unexplained reading below
# unknown_obstacle_m adds a synthetic "unknown_obstacle" straight ahead
# (walls, glass, things YOLO misses); it is never stored in memory.
# ------------------------------------------------------------------
range_fusion:
  cone_deg: 7.5              # HC-SR04 ~15 deg cone
  min_m: 0.2
  max_m: 4.0
  unknown_obstacle_m: 1.2
  agree_ratio: 2.0

# ------------------------------------------------------------------
# Pose (navigation/sensing.py PhonePose; SensorServer app on the phone,
# ws://<network.phone_ip>:<network.sensor_port>)
# ------------------------------------------------------------------
pose:
  stride_m: 0.7              # distance moved per detected step
  stale_after_s: 2.0         # no rotation data this long -> pose invalid
  reconnect_delay_s: 1.0     # wait between WebSocket reconnect attempts
  startup_wait_s: 3.0        # wait this long for the first heading
  # Fallback step counter (accelerometer), used automatically when
  # step_detector has sent nothing for step_fallback_after_s. Needs a fast
  # accelerometer: set SensorServer's sampling rate to ~20000 us (50 Hz).
  step_fallback_after_s: 0.5
  step_threshold: 10.5       # m/s^2, peak of low-passed |acceleration|
  step_min_gap_s: 0.3        # minimum time between two steps
  step_lowpass_tau_s: 0.08   # low-pass time constant

# ------------------------------------------------------------------
# Perception
# ------------------------------------------------------------------
perception:
  weights: best.pt          # YOLO weights (--weights overrides)
  confidence: 0.35
  device: cpu                # "cpu" or a CUDA index such as "0"
  # Ground-level classes: distance from the box bottom edge with a
  # flat-ground model (camera_height_m above the ground), clamped.
  camera_height_m: 1.3       # chest mount
  ground_labels: [pothole, stairs, curb, drain]
  ground_min_m: 0.5
  ground_max_m: 8.0

# ------------------------------------------------------------------
# Hazard severity (navigation/hazard.py)
# ------------------------------------------------------------------
hazard:
  urgency_threshold: 0.72
  directly_ahead_deg: 20.0
  very_close_m: 2.5
  immediate_close_m: 1.5
  critical_ttc_s: 1.5
  high_risk_ttc_s: 2.5
  # Score bonus for negative obstacles so they become urgent sooner.
  ground_hazard_bonus: 0.25
  ground_labels: [pothole, stairs, curb, drain]

# ------------------------------------------------------------------
# Local path planner (navigation/planner.py)
# safety_margin_m = 0.25 as on the path-planner-hrtf-updated branch.
# ------------------------------------------------------------------
planner:
  horizon_m: 5.0
  path_width_m: 0.65
  safety_margin_m: 0.25
  walking_speed_m_s: 0.5
  prediction_horizon_s: 4.0
  prediction_step_s: 0.25
  static_action_distance_m: 2.75
  dynamic_action_distance_m: 6.0
  dynamic_ttc_s: 4.0
  confirm_frames: 3
  clear_frames: 3

# ------------------------------------------------------------------
# Hazard trajectory / velocity (navigation/trajectory.py)
# ------------------------------------------------------------------
trajectory:
  smoothing: 0.35
  max_speed_m_s: 8.0

# ------------------------------------------------------------------
# Persistent route memory (navigation/memory.py)
# ------------------------------------------------------------------
memory:
  db_path: navigation_memory.db
  # Class-aware decay: decay_weight = 0.5 ** (seconds since last seen /
  # effective half-life), effective half-life = category half_life_s x
  # min(1 + reinforce_per_session x (sessions_seen - 1), reinforce_max).
  # A hazard is deleted once decay_weight < min_decay_weight (0.05), i.e.
  # after about 4.3 half-lives: person ~43 s, cone ~8.6 h, pothole ~60 days.
  categories:
    dynamic:   {half_life_s: 10,      labels: [person, dog, bicycle, car, bus, truck, motorbike, tricycle, autorickshaw, animal]}
    temporary: {half_life_s: 7200,    labels: [reflective_cone, barrier, spherical_roadblock, warning_column, ashcan]}
    permanent: {half_life_s: 1209600, labels: [pothole, stairs, curb, drain, pole, tree, fire_hydrant, stop_sign]}
  default_half_life_s: 3600    # labels in no category
  reinforce_per_session: 0.5   # half-life x (1 + 0.5 x (sessions_seen - 1)) ...
  reinforce_max: 3.0           # ... capped at x3
  # Backward-compatible fallback: one half-life for every label, used only
  # if `categories` is removed.
  decay_half_life_s: 30.0
  min_decay_weight: 0.05
  max_entries: 500
  match_radius_m: 1.0
  dynamic_labels: [person, dog, bicycle, car, bus, truck, motorbike, tricycle, autorickshaw, animal]

# ------------------------------------------------------------------
# Reasoning over memory (navigation/memory_reasoning.py)
# Evidence-based forgetting: a remembered static hazard that should be in
# clear view (trusted pose, forward distance forget_min_m..forget_max_m,
# at least forget_edge_margin_deg inside the camera's field of view, not
# hidden behind a detection within occlusion_deg that is occlusion_margin_m
# nearer) but is not detected gets a miss (at most one per miss_interval_s):
# belief *= miss_factor. Forgotten after forget_after_misses misses or
# belief < forget_belief. Each sighting: misses = 0, belief += hit_gain.
# ------------------------------------------------------------------
memory_reasoning:
  forget_min_m: 1.5
  forget_max_m: 6.0
  forget_edge_margin_deg: 8.0
  occlusion_deg: 6.0
  occlusion_margin_m: 0.5
  miss_interval_s: 0.5
  miss_factor: 0.7
  forget_after_misses: 4
  forget_belief: 0.2
  hit_gain: 0.3
  # Memory early warning (sonified top-k acoustic attention): a remembered
  # static hazard the camera does not see now, cue_min_m..cue_max_m ahead,
  # within cue_max_bearing_deg, with decay_weight x belief >= cue_min_trust,
  # ranked by `attention`; one cue per frame at most, cooldowns per hazard
  # and global. Urgent / path-guidance cues in the same frame suppress it.
  cue_min_m: 2.5
  cue_max_m: 8.0
  cue_max_bearing_deg: 40.0
  cue_min_trust: 0.3
  cue_min_sightings: 3         # confirmed hazards only (one-frame false positives are not cued)
  cue_cooldown_s: 8.0
  cue_global_cooldown_s: 2.0
  cue_skip_seen_within_s: 1.0  # seen this recently = still in view (a dropout, not a memory)
  cue_display_s: 3.0           # status-panel "Memory cue:" line stays this long

# ------------------------------------------------------------------
# Acoustic attention (navigation/reasoning.py)
# ------------------------------------------------------------------
attention:
  top_k: 3
  weights: [0.45, 0.25, 0.30]  # distance, alignment, recency

# ------------------------------------------------------------------
# HRTF audio (navigation/hrtf_renderer.py)
# ------------------------------------------------------------------
audio:
  hrtf_path: hrtf/mit_kemar_normal_pinna.sofa
  device: null                 # index or name fragment; null = automatic
  warning_cooldown_s: 0.8      # urgent cues
  path_guidance_cooldown_s: 1.0
  memory_cue_cooldown_s: 2.0   # memory early-warning cues (lowest priority)
  max_queue: 2
  # Names containing these are Bluetooth (100-250 ms extra latency, used last).
  bluetooth_keywords: [bluetooth, hands-free, handsfree, a2dp, airpods, buds, enco]
  # Names containing these (and no Bluetooth keyword) are wired headphones.
  headphone_keywords: [headphone, earphone, headset]

# ------------------------------------------------------------------
# Visual SLAM (navigation/vslam.py), used with --pose slam.
# Lightweight keyframe monocular SLAM on the laptop: ORB visual odometry,
# metric scale from the phone's steps (or assumed_speed_m_s without the
# phone), heading fused with the phone's rotation vector, loop closure +
# 2D pose graph, and a saved map for relocalization on the next walk.
# ------------------------------------------------------------------
slam:
  map_path: slam_map.npz     # saved keyframe map (--slam-map overrides)
  process_every_n: 1         # run SLAM on every Nth frame
  image_width: 640           # SLAM working width (frames are downscaled)
  # Camera intrinsics. Run scripts/manual/calibrate_camera.py and paste the
  # values here; with fx: null the intrinsics come from hfov_deg instead.
  hfov_deg: 65.0
  fx: null
  fy: null
  cx: null
  cy: null
  calib_width: null          # frame width the calibration was made at
  camera_pitch_deg: 0.0      # chest mount tilt, positive = looking down
  n_features: 1500           # ORB features per frame
  map_features: 800          # features stored per keyframe
  grid_cols: 8               # feature bucketing grid
  grid_rows: 6
  fast_threshold: 12
  ratio_test: 0.75           # Lowe ratio for descriptor matches
  ransac_px: 1.0             # essential-matrix RANSAC threshold (pixels)
  min_inliers: 40            # below this the frame is not tracked
  lost_frames: 8             # untracked frames in a row -> LOST
  kf_min_inliers: 120        # new keyframe when inliers fall below this
  kf_parallax_px: 25.0       # ... or translation parallax exceeds this
  kf_yaw_deg: 15.0           # ... or the camera turned this much
  kf_max_distance_m: 1.5     # ... or walked this far
  min_trans_parallax_px: 2.0 # below this the motion is treated as rotation only
  max_lateral_deg: 45.0      # visual direction more sideways -> use forward
  dir_min_parallax_px: 8.0   # below this parallax the visual direction is too noisy -> use forward
  assumed_speed_m_s: 1.0     # scale without the phone (recorded video)
  heading_phone_weight: 0.05 # per keyframe pull towards the phone heading
  loop_min_gap: 30           # keyframes between a loop's two ends
  loop_radius_m: 3.0         # loop search radius ...
  loop_radius_per_m: 0.05    # ... + this much per metre since the last loop
  loop_candidates: 3
  loop_min_ncc: 0.55         # thumbnail similarity for loop candidates
  loop_min_inliers: 80
  loop_max_odom_sigma: 4.0   # reject a loop that stretches odometry more than this
  reloc_candidates: 5
  reloc_min_inliers: 60
  reloc_every_n: 3           # relocalization attempt every N processed frames
  odom_sigma_m: 0.05         # pose-graph odometry std dev (m) ...
  odom_sigma_per_m: 0.1      # ... + this per metre of the edge
  odom_sigma_deg: 2.0
  loop_sigma_m: 0.2          # metric loop / relocalization edges
  loop_sigma_unscaled_m: 1.0 # rotation-only relocalization edges
  loop_sigma_deg: 3.0
  graph_loss: linear         # scipy least_squares loss
  graph_f_scale: 3.0
  save_every_kf: 20          # also save the map every N new keyframes
